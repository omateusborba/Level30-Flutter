# Level30 — Opção C: JAR Spring Boot + Postgres numa VM (Oracle Cloud Always Free),
# exposto via Cloudflare Tunnel. Angular vai no Cloudflare Pages (fora daqui).
#
#   cp .env.example .env   &&   editar .env
#   docker compose up -d --build
#
# Ver specs/003-fase-5/deploy-oracle.md para o passo a passo completo.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-level30}
      POSTGRES_USER: ${DB_USER:-level30}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-level30} -d ${DB_NAME:-level30}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [level30]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: level30-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-level30}
      DB_USER: ${DB_USER:-level30}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS no .env (URL do dashboard)}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@level30.app}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?defina SEED_ADMIN_PASSWORD no .env}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      # IA generativa (opcional). Vazio = modo fallback determinístico.
      AI_WORKER_URL: ${AI_WORKER_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    expose:
      - "8080"
    networks: [level30]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?defina TUNNEL_TOKEN no .env (token do tunnel criado no painel Cloudflare)}
    depends_on:
      - api
    networks: [level30]

volumes:
  pgdata:

networks:
  level30:
    driver: bridge
