name: secret-scan

# Bloqueia merge se um segredo for introduzido no codigo ou no historico.
# Complemento do .gitignore — o .gitignore evita o commit acidental,
# este workflow e a rede de seguranca no PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historico completo — gitleaks varre todos os commits
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
